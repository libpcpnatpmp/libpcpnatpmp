name: Commit Message Check

on:
  pull_request:
    branches: [ "master" ]

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Validate commit messages
      uses: wagoid/commitlint-github-action@v6

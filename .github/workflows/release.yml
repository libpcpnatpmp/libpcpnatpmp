name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        body_path: CHANGELOG.md
